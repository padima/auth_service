[package]
name = "auth_service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "^1", features = ["derive"] }
dotenv = "^0.15.0"
jsonwebtoken = "^9"

[dev-dependencies]
serde_json = "^1.0"
